name: Client Workspace Prisma validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/client-workspace-prisma-validation.yml"
      - "package.json"
      - "package-lock.json"
      - "prisma.config.ts"
      - "prisma/**"

permissions:
  contents: read

jobs:
  prisma-native-validation:
    if: ${{ github.event.pull_request.number == 73 && github.event.pull_request.head.ref == 'feat/client-workspace-persistence-72' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: digipants_ws_dev
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: digipants_workspace_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digipants_ws_dev -d digipants_workspace_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies with engine integrity checks enabled
        run: npm ci
      - name: Create loopback database URLs and isolated shadow database
        env:
          DIRECT_URL: postgresql://digipants_ws_dev:disposable_ci_only@127.0.0.1:5432/digipants_workspace_dev
          SHADOW_DIRECT_URL: postgresql://digipants_ws_dev:disposable_ci_only@127.0.0.1:5432/workspace_shadow
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          {
            echo "DIRECT_URL=$DIRECT_URL"
            echo "SHADOW_DIRECT_URL=$SHADOW_DIRECT_URL"
          } >> "$GITHUB_ENV"
          docker exec "$POSTGRES_CONTAINER_ID" psql \
            -v ON_ERROR_STOP=1 \
            -U digipants_ws_dev \
            -d postgres \
            -c 'CREATE DATABASE workspace_shadow;'
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Apply migration
        run: npm run db:migrate:deploy
      - name: Verify migration deployment is idempotent
        run: npm run db:migrate:deploy
      - name: Verify migration status
        run: npm run db:migrate:status
      - name: Verify the successful migration ledger row
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          expected_name=20261029130000_client_workspace_foundation
          success_count="$(docker exec "$POSTGRES_CONTAINER_ID" psql -v ON_ERROR_STOP=1 -U digipants_ws_dev -d digipants_workspace_dev -Atqc \
            "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '$expected_name' AND finished_at IS NOT NULL AND rolled_back_at IS NULL")"
          total_count="$(docker exec "$POSTGRES_CONTAINER_ID" psql -v ON_ERROR_STOP=1 -U digipants_ws_dev -d digipants_workspace_dev -Atqc \
            'SELECT count(*) FROM "_prisma_migrations"')"
          test "$success_count" = 1
          test "$total_count" = 1
      - name: Verify migration history matches the datasource
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-config-datasource --exit-code
      - name: Build production application
        run: npm run build
