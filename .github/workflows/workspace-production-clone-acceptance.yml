name: Disposable Neon production-clone acceptance

on:
  push:
    branches:
      - feat/client-workspace-pooler-tls-acceptance-119
  workflow_dispatch:
    inputs:
      run_acceptance:
        description: Run the one-time synthetic clone rehearsal
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: client-workspace-production-clone-acceptance
  cancel-in-progress: false

jobs:
  clone-acceptance:
    if: ${{ github.ref == 'refs/heads/feat/client-workspace-pooler-tls-acceptance-119' && ((github.event_name == 'workflow_dispatch' && inputs.run_acceptance == true) || (github.event_name == 'push' && github.event.before == '01bf9b4f213caa9c38e5168bb9ef739b8ddd989b')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: neon-pooler-acceptance
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: local_restore
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: local_restore
          PGSSLROOTCERT: /tmp/neon-ca-bundle.pem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U local_restore -d local_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Confirm protected one-time run gate
        env:
          WORKSPACE_POOLER_ACCEPTANCE_RUN: ${{ vars.WORKSPACE_POOLER_ACCEPTANCE_RUN }}
        run: test "$WORKSPACE_POOLER_ACCEPTANCE_RUN" = "1"

      - name: Check out the reviewed test harness at the dispatched revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: acceptance-harness
          persist-credentials: false

      - name: Check out the reviewed production source commit
        uses: actions/checkout@v4
        with:
          ref: de772825a1eeb92b9fd1a7331fb9978930d378c6
          path: production-source
          persist-credentials: false

      - name: Verify immutable source pins
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C acceptance-harness rev-parse HEAD)" = "$DISPATCH_SHA"
          test "$(git -C production-source rev-parse HEAD)" = "de772825a1eeb92b9fd1a7331fb9978930d378c6"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Copy only the acceptance harness into the pinned source
        run: |
          set -euo pipefail
          mkdir -p production-source/experiments/client-workspace-auth/scripts
          cp acceptance-harness/experiments/client-workspace-auth/scripts/neon-pooler-acceptance.mjs \
            production-source/experiments/client-workspace-auth/scripts/
          cp acceptance-harness/experiments/client-workspace-auth/tests/neon-pooler-acceptance.test.mjs \
            production-source/experiments/client-workspace-auth/tests/
          cp acceptance-harness/experiments/client-workspace-auth/tests/trusted-published-project-postgres.test.mjs \
            production-source/experiments/client-workspace-auth/tests/

      - name: Install locked production-source dependencies
        run: |
          set -euo pipefail
          npm ci --prefix production-source
          npm ci --prefix production-source/experiments/client-workspace-auth

      - name: Run harness unit checks before any hosted credential is exposed
        working-directory: production-source/experiments/client-workspace-auth
        run: node --test tests/neon-pooler-acceptance.test.mjs

      - name: Initialize the isolated PostgreSQL 17 service
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          printf 'POSTGRES_CONTAINER_ID=%s\n' "$POSTGRES_CONTAINER_ID" >> "$GITHUB_ENV"

      - name: Provide libpq with the runner's trusted CA roots
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { rootCertificates } from "node:tls";
          if (rootCertificates.length === 0) throw new Error("The runner has no trusted TLS roots");
          writeFileSync(
            `${process.env.RUNNER_TEMP}/neon-ca-bundle.pem`,
            rootCertificates.join("\n") + "\n",
            { mode: 0o600 },
          );
          NODE
          docker cp "$RUNNER_TEMP/neon-ca-bundle.pem" "$POSTGRES_CONTAINER_ID:/tmp/neon-ca-bundle.pem"
          docker exec -u 0 "$POSTGRES_CONTAINER_ID" chmod 0644 /tmp/neon-ca-bundle.pem
          docker exec "$POSTGRES_CONTAINER_ID" test -s /tmp/neon-ca-bundle.pem
          docker exec "$POSTGRES_CONTAINER_ID" psql -U local_restore -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE digipants_workspace_dev" \
            -c "CREATE DATABASE workspace_shadow" \
            -c "CREATE DATABASE auth_spike_test" \
            -c "CREATE DATABASE auth_shadow"

      - name: Generate ephemeral local auth configuration
        run: |
          set -euo pipefail
          local_auth_secret="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          local_workspace_test_password="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          echo "::add-mask::$local_auth_secret"
          echo "::add-mask::$local_workspace_test_password"
          printf 'BETTER_AUTH_SECRET=%s\nLOCAL_WORKSPACE_TEST_PASSWORD=%s\n' "$local_auth_secret" "$local_workspace_test_password" >> "$GITHUB_ENV"

      - name: Apply versioned migrations to fresh local databases and prove they contain no fixtures
        env:
          DATABASE_URL: postgresql://local_restore:disposable_ci_only@127.0.0.1:5432/digipants_workspace_dev
          DIRECT_URL: postgresql://local_restore:disposable_ci_only@127.0.0.1:5432/digipants_workspace_dev
          SHADOW_DIRECT_URL: postgresql://local_restore:disposable_ci_only@127.0.0.1:5432/workspace_shadow
          AUTH_DATABASE_URL: postgresql://local_restore:disposable_ci_only@127.0.0.1:5432/auth_spike_test
          AUTH_SHADOW_DATABASE_URL: postgresql://local_restore:disposable_ci_only@127.0.0.1:5432/auth_shadow
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          npm --prefix production-source run db:generate
          npm --prefix production-source run db:migrate:deploy
          npm --prefix production-source run db:migrate:deploy
          npm --prefix production-source run db:migrate:status
          (cd production-source && npx prisma migrate diff \
            --from-migrations prisma/migrations --to-config-datasource --exit-code)
          (
            cd production-source/experiments/client-workspace-auth
            npm run auth:schema
            npm run db:generate
            npm run db:migrate:deploy
            npm run db:migrate:deploy
            npm run db:migrate:status
            npm run db:migrate:diff
          )
          counts="$(docker exec "$POSTGRES_CONTAINER_ID" psql -U local_restore \
            -d digipants_workspace_dev -X -qAt -F '|' -v ON_ERROR_STOP=1 -c \
            "SELECT (SELECT count(*)=0 FROM public.workspace_tenants)::text || '|' || \
                    (SELECT count(*)=0 FROM public.workspace_projects)::text")"
          test "$counts" = "true|true"
          auth_counts="$(docker exec "$POSTGRES_CONTAINER_ID" psql -U local_restore \
            -d auth_spike_test -X -qAt -F '|' -v ON_ERROR_STOP=1 -c \
            "SELECT (SELECT count(*)=0 FROM auth_spike.\"user\")::text || '|' || \
                    (SELECT count(*)=0 FROM auth_spike.session)::text || '|' || \
                    (SELECT count(*)=0 FROM auth_spike.mail_delivery_outbox)::text")"
          test "$auth_counts" = "true|true|true"

      - name: Install local test roles, RLS and synthetic application fixture
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U local_restore \
            -d digipants_workspace_dev -v ON_ERROR_STOP=1 \
            < production-source/experiments/client-workspace-db-security/sql/seed.sql
          {
            printf 'BEGIN;\n'
            cat production-source/experiments/client-workspace-db-security/sql/roles.sql
            cat production-source/experiments/client-workspace-db-security/sql/hardening.sql
            printf '\nCOMMIT;\n'
          } | docker exec -i "$POSTGRES_CONTAINER_ID" psql -U local_restore \
            -d digipants_workspace_dev -v ON_ERROR_STOP=1
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U local_restore \
            -d digipants_workspace_dev -v ON_ERROR_STOP=1 \
            < production-source/scripts/workspace/production-rls-hardening.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U local_restore \
            -d auth_spike_test -v ON_ERROR_STOP=1 \
            < production-source/experiments/client-workspace-auth/sql/runtime-privileges.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U local_restore \
            -d auth_spike_test -v ON_ERROR_STOP=1 \
            < production-source/experiments/client-workspace-auth/sql/verify-runtime-privileges.sql
          docker exec "$POSTGRES_CONTAINER_ID" psql -U local_restore -d postgres \
            -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE cw_client_read_ci LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'local-only-ci-password'"
          docker exec "$POSTGRES_CONTAINER_ID" psql -U local_restore \
            -d digipants_workspace_dev -v ON_ERROR_STOP=1 -c \
            "GRANT cw_runtime TO cw_client_read_ci WITH INHERIT TRUE, SET FALSE"
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U local_restore -d postgres \
            -v workspace_password="$LOCAL_WORKSPACE_TEST_PASSWORD" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE digipants_ws_dev LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD :'workspace_password';
          GRANT cw_schema_owner TO digipants_ws_dev WITH INHERIT TRUE, SET TRUE;
          SQL

      - name: Verify trusted session, MFA, project-grant, revocation and logout behavior on local PostgreSQL
        working-directory: production-source/experiments/client-workspace-auth
        env:
          RUN_AUTH_EXPERIMENT_INTEGRATION: "1"
          AUTH_EXPERIMENT_ENABLED: "1"
          AUTH_DATABASE_URL: postgresql://local_restore:disposable_ci_only@127.0.0.1:5432/auth_spike_test
          WORKSPACE_READ_RUNTIME_DATABASE_URL: postgresql://cw_client_read_ci:local-only-ci-password@127.0.0.1:5432/digipants_workspace_dev
        run: |
          set -euo pipefail
          export WORKSPACE_DATABASE_URL="postgresql://digipants_ws_dev:${LOCAL_WORKSPACE_TEST_PASSWORD}@127.0.0.1:5432/digipants_workspace_dev"
          node --conditions=react-server --import tsx --test tests/trusted-published-project-postgres.test.mjs

      - name: Validate the child-only direct URL and pin hosted connection targets
        env:
          WORKSPACE_ACTIVATION_DIRECT_URL: ${{ secrets.WORKSPACE_ACTIVATION_DIRECT_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$WORKSPACE_ACTIVATION_DIRECT_URL"
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          let url;
          try { url = new URL(process.env.WORKSPACE_ACTIVATION_DIRECT_URL || ""); }
          catch { throw new Error("The direct connection URL is unavailable or malformed"); }
          const allowed = new Set(["sslmode", "channel_binding"]);
          const checks = {
            protocol: ["postgres:", "postgresql:"].includes(url.protocol),
            childHost: url.hostname === "ep-summer-haze-za0emgk3.c-2.eu-west-2.aws.neon.tech",
            restrictedLogin: url.username === "cw_activation_migrator",
            passwordPresent: url.password.length >= 16,
            expectedDatabase: url.pathname === "/digipants_workspace_prod",
            noHash: !url.hash,
            standardPort: !url.port || url.port === "5432",
            supportedQueryKeys: [...url.searchParams.keys()].every(key => allowed.has(key)),
          };
          if (!Object.values(checks).every(Boolean)) {
            process.stdout.write("Direct URL validation checks: " + JSON.stringify(checks) + "\n");
            throw new Error("The URL is not the reviewed restricted login on the disposable child");
          }
          url.searchParams.set("sslmode", "verify-full");
          url.searchParams.set("channel_binding", "require");
          const workspace = new URL(url);
          const auth = new URL(url);
          auth.pathname = "/digipants_auth_prod";
          for (const [name, value] of [
            ["DIRECT_URL", workspace.href],
            ["DATABASE_URL", workspace.href],
            ["AUTH_DATABASE_URL", auth.href],
          ]) {
            process.stdout.write("::add-mask::" + value + "\n");
            appendFileSync(process.env.GITHUB_ENV, name + "=" + value + "\n");
          }
          NODE

      - name: Verify clone signing-key and restricted-role flags; keep auth records private
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          checks="$(docker exec "$POSTGRES_CONTAINER_ID" psql "$DIRECT_URL" -X -qAt -F '|' \
            -v ON_ERROR_STOP=1 \
            -c "RESET ROLE" \
            -c \
            "SELECT (SELECT count(*)=1 AND min(octet_length(signing_key))=32 FROM public.workspace_context_signing_keys)::text || '|' || \
                    (SELECT rolcanlogin AND NOT rolsuper AND NOT rolbypassrls AND NOT rolcreatedb AND NOT rolcreaterole \
                       FROM pg_catalog.pg_roles WHERE rolname=current_user)::text || '|' || \
                    (pg_has_role(current_user,'cw_schema_owner','SET'))::text || '|' || \
                    (NOT pg_has_role(current_user,'cw_runtime','USAGE'))::text || '|' || \
                    (NOT pg_has_role(current_user,'cw_audit_writer','USAGE'))::text")"
          if [[ "$checks" != "true|true|true|true|true" ]]; then
            echo "Workspace clone role flags: $checks"
            exit 1
          fi
          auth_checks="$(docker exec "$POSTGRES_CONTAINER_ID" psql "$AUTH_DATABASE_URL" \
            -X -qAt -v ON_ERROR_STOP=1 \
            -c "RESET ROLE" \
            -c \
            "SELECT (count(*)=3 AND bool_and(NOT has_table_privilege(current_user,c.oid,'SELECT')))::text \
               FROM pg_catalog.pg_class c \
               JOIN pg_catalog.pg_namespace n ON n.oid=c.relnamespace \
              WHERE n.nspname='auth_spike' \
                AND c.relname IN ('user','session','mail_delivery_outbox') \
                AND c.relkind='r'")"
          if [[ "$auth_checks" != "true" ]]; then
            echo "Auth clone table privacy flag: $auth_checks"
            exit 1
          fi

      - name: Verify both migration ledgers and security preflights on the clone
        working-directory: production-source/experiments/client-workspace-auth
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          npm --prefix ../.. run db:generate
          npm run auth:schema
          npm run db:generate
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readdir, readFile } from "node:fs/promises";
          import path from "node:path";
          import pg from "pg";

          async function verify(directory, connectionString) {
            const client = new pg.Client({ connectionString });
            try {
              await client.connect();
              await client.query("RESET ROLE");
              const identity = (await client.query(
                "SELECT session_user AS login, current_user AS role, current_database() AS database, " +
                  "has_table_privilege(current_user,'public._prisma_migrations','SELECT') AS can_read_ledger"
              )).rows[0];
              const expectedDatabase = directory === "prisma/migrations"
                ? "digipants_auth_prod" : "digipants_workspace_prod";
              const target = {
                login: identity?.login ?? null,
                role: identity?.role ?? null,
                database: identity?.database ?? null,
                canReadLedger: identity?.can_read_ledger ?? null,
              };
              process.stdout.write("Ledger verifier target: " + JSON.stringify(target) + "\\n");
              if (target.login !== "cw_activation_migrator" ||
                  target.role !== "cw_activation_migrator" ||
                  target.database !== expectedDatabase || target.canReadLedger !== true) {
                throw new Error("ledger-target-or-select");
              }
              const rows = (await client.query(
                'SELECT migration_name,checksum,finished_at,rolled_back_at FROM public."_prisma_migrations" WHERE rolled_back_at IS NULL ORDER BY migration_name'
              )).rows;
              const entries = (await readdir(directory, { withFileTypes: true }))
                .filter(entry => entry.isDirectory()).map(entry => entry.name).sort();
              if (rows.length !== entries.length) throw new Error("ledger-count");
              for (const name of entries) {
                const row = rows.find(item => item.migration_name === name);
                const checksum = createHash("sha256")
                  .update(await readFile(path.join(directory, name, "migration.sql")))
                  .digest("hex");
                if (!row || !row.finished_at || row.rolled_back_at || row.checksum !== checksum) {
                  throw new Error("ledger-checksum");
                }
              }
            } finally { await client.end().catch(() => {}); }
          }

          async function preflight(filename, connectionString, setSchemaOwnerRole) {
            const client = new pg.Client({ connectionString });
            try {
              await client.connect();
              if (setSchemaOwnerRole) await client.query("SET ROLE cw_schema_owner");
              const result = await client.query(await readFile(filename, "utf8"));
              if (result.rows.length !== 1) throw new Error("preflight-row-count");
              const failedFlags = Object.entries(result.rows[0])
                .filter(([, value]) => value !== true)
                .map(([name]) => name);
              if (failedFlags.length) {
                process.stderr.write("Preflight false flags: " + failedFlags.join(", ") + "\\n");
                throw new Error("preflight-flags");
              }
            } finally { await client.end().catch(() => {}); }
          }

          let stage = "workspace migration ledger";
          try {
            await verify("../../prisma/migrations", process.env.DIRECT_URL);
            stage = "auth migration ledger";
            await verify("prisma/migrations", process.env.AUTH_DATABASE_URL);
            stage = "workspace security preflight";
            await preflight("../../scripts/workspace/production-security-preflight.sql",
              process.env.DIRECT_URL, true);
            stage = "auth security preflight";
            await preflight("../../scripts/workspace/production-auth-preflight.sql",
              process.env.AUTH_DATABASE_URL, false);
            process.stdout.write("PASS: cloned Workspace/Auth ledgers, checksums, and every security-preflight flag\\n");
          } catch (error) {
            const code = typeof error?.code === "string" ? error.code : "validation";
            process.stderr.write("Clone acceptance failed during " + stage + " (" + code + "); details suppressed.\\n");
            process.exitCode = 1;
          }
          NODE

      - name: Seed only the two reviewed synthetic tenants on the child
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          fixture_output="$(docker exec -i -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" \
            sh -eu -c 'psql "$DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1' <<'SQL'
          SET ROLE cw_schema_owner;
          WITH counts AS (
            SELECT
              (SELECT count(*) FROM public.workspace_tenants) AS tenants,
              (SELECT count(*) FROM public.workspace_projects) AS projects,
              (SELECT count(*) FROM public.workspace_principals) AS principals,
              (SELECT count(*) FROM public.workspace_client_memberships) AS client_memberships,
              (SELECT count(*) FROM public.workspace_staff_memberships) AS staff_memberships,
              (SELECT count(*) FROM public.workspace_client_project_grants) AS client_grants,
              (SELECT count(*) FROM public.workspace_staff_project_grants) AS staff_grants,
              (SELECT count(*) FROM public.workspace_invitation_records) AS invitations,
              (SELECT count(*) FROM public.workspace_enrollment_attempts) AS enrollments,
              (SELECT count(*) FROM public.workspace_milestones) AS milestones,
              (SELECT count(*) FROM public.workspace_progress_updates) AS progress_updates,
              (SELECT count(*) FROM public.workspace_context_signing_keys) AS signing_keys
          ), markers AS (
            SELECT
              (SELECT array_agg(id::text ORDER BY id) FROM public.workspace_tenants) AS tenant_ids,
              (SELECT array_agg(legal_name ORDER BY id) FROM public.workspace_tenants) AS tenant_names,
              (SELECT array_agg(id::text ORDER BY id) FROM public.workspace_projects) AS project_ids,
              (SELECT array_agg(publication ORDER BY id) FROM public.workspace_projects) AS project_publication,
              (SELECT array_agg(id::text ORDER BY id) FROM public.workspace_principals) AS principal_ids,
              (SELECT array_agg(provider_subject ORDER BY id) FROM public.workspace_principals) AS subjects,
              (SELECT array_agg(kind ORDER BY id) FROM public.workspace_principals) AS principal_kinds,
              (SELECT array_agg(principal_id::text ORDER BY principal_id) FROM public.workspace_staff_memberships) AS staff_members,
              (SELECT array_agg(id::text ORDER BY id) FROM public.workspace_milestones) AS milestone_ids,
              (SELECT array_agg(id::text ORDER BY id) FROM public.workspace_progress_updates) AS progress_ids,
              (SELECT count(*) = 2 FROM public.workspace_projects
                WHERE (id,tenant_id,title) IN (
                  ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid,'11111111-1111-4111-8111-111111111111'::uuid,'Synthetic Project A'),
                  ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'::uuid,'22222222-2222-4222-8222-222222222222'::uuid,'Synthetic Project B')
                )) AS projects_exact,
              (SELECT count(*) = 1 FROM public.workspace_client_memberships
                WHERE tenant_id='22222222-2222-4222-8222-222222222222'
                  AND principal_id='cccccccc-cccc-4ccc-8ccc-cccccccccccc'
                  AND principal_kind='client' AND status='active' AND revoked_at IS NULL) AS client_membership_exact,
              (SELECT count(*) = 1 FROM public.workspace_client_project_grants
                WHERE tenant_id='22222222-2222-4222-8222-222222222222'
                  AND project_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'
                  AND principal_id='cccccccc-cccc-4ccc-8ccc-cccccccccccc'
                  AND role='client_viewer' AND status='active' AND revoked_at IS NULL) AS client_grant_exact,
              (SELECT count(*) = 3 FROM public.workspace_staff_project_grants
                WHERE status='active' AND revoked_at IS NULL
                  AND (tenant_id,project_id,principal_id,role) IN (
                    ('11111111-1111-4111-8111-111111111111'::uuid,'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid,'33333333-3333-4333-8333-333333333333'::uuid,'delivery_lead'),
                    ('11111111-1111-4111-8111-111111111111'::uuid,'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid,'44444444-4444-4444-8444-444444444444'::uuid,'workspace_owner'),
                    ('22222222-2222-4222-8222-222222222222'::uuid,'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'::uuid,'55555555-5555-4555-8555-555555555555'::uuid,'delivery_lead')
                  )) AS staff_grants_exact,
              (SELECT count(*) = 1 FROM public.workspace_invitation_records
                WHERE id='77777777-7777-4777-8777-777777777777'
                  AND tenant_id='22222222-2222-4222-8222-222222222222'
                  AND project_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'
                  AND intended_email='synthetic-b@example.invalid'
                  AND intended_role='client_viewer') AS invitation_exact,
              (SELECT count(*) = 1 FROM public.workspace_enrollment_attempts
                WHERE id='aaaaaaa0-bbbb-4ccc-8ddd-eeeeeeeeeeee'
                  AND invitation_id='77777777-7777-4777-8777-777777777777'
                  AND provider_subject='99999999-9999-4999-8999-999999999999'
                  AND tenant_id='22222222-2222-4222-8222-222222222222'
                  AND project_id='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'
                  AND state='pending') AS enrollment_exact,
              (SELECT count(*) = 2 FROM public.workspace_milestones
                WHERE (id,tenant_id,project_id,client_visible,approved_by_staff_id) IN (
                  ('a1111111-1111-4111-8111-111111111111'::uuid,'11111111-1111-4111-8111-111111111111'::uuid,'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid,true,'33333333-3333-4333-8333-333333333333'::uuid),
                  ('a1111111-1111-4111-8111-222222222222'::uuid,'11111111-1111-4111-8111-111111111111'::uuid,'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'::uuid,true,'33333333-3333-4333-8333-333333333333'::uuid)
                )) AS milestones_exact,
              (SELECT count(*) = 1 FROM public.workspace_progress_updates
                WHERE id='a2222222-2222-4222-8222-222222222222'
                  AND tenant_id='11111111-1111-4111-8111-111111111111'
                  AND project_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
                  AND status='approved' AND client_visible
                  AND approved_by_staff_id='33333333-3333-4333-8333-333333333333') AS progress_exact
          )
          SELECT CASE
            WHEN tenants=0 AND projects=0 AND principals=0 AND client_memberships=0
              AND staff_memberships=0 AND client_grants=0 AND staff_grants=0
              AND invitations=0 AND enrollments=0 AND milestones=0
              AND progress_updates=0 AND signing_keys=1
              THEN 'empty'
            WHEN tenants=2 AND projects=2 AND principals=4 AND client_memberships=1
              AND staff_memberships=3 AND client_grants=1 AND staff_grants=3
              AND invitations=1 AND enrollments=1 AND milestones=2
              AND progress_updates=1 AND signing_keys=1
              AND tenant_ids=ARRAY['11111111-1111-4111-8111-111111111111','22222222-2222-4222-8222-222222222222']
              AND tenant_names=ARRAY['Synthetic Tenant A','Synthetic Tenant B']
              AND project_ids=ARRAY['aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa','bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb']
              AND project_publication=ARRAY['published','unpublished']
              AND principal_ids=ARRAY['33333333-3333-4333-8333-333333333333','44444444-4444-4444-8444-444444444444','55555555-5555-4555-8555-555555555555','cccccccc-cccc-4ccc-8ccc-cccccccccccc']
              AND subjects=ARRAY['synthetic-security-staff-a','synthetic-security-owner','synthetic-security-staff-b','99999999-9999-4999-8999-999999999999']
              AND principal_kinds=ARRAY['staff','staff','staff','client']
              AND staff_members=ARRAY['33333333-3333-4333-8333-333333333333','44444444-4444-4444-8444-444444444444','55555555-5555-4555-8555-555555555555']
              AND milestone_ids=ARRAY['a1111111-1111-4111-8111-111111111111','a1111111-1111-4111-8111-222222222222']
              AND progress_ids=ARRAY['a2222222-2222-4222-8222-222222222222']
              AND projects_exact AND client_membership_exact AND client_grant_exact
              AND staff_grants_exact AND invitation_exact AND enrollment_exact
              AND milestones_exact AND progress_exact
              THEN 'seeded'
            ELSE 'unexpected'
          END
          FROM counts CROSS JOIN markers;
          SQL
          )"
          fixture_state="$(printf '%s\n' "$fixture_output" | tr -d '\r' | grep -Eo 'empty|seeded|unexpected' | tail -n 1 || true)"
          case "$fixture_state" in
            empty)
              {
                printf 'SET ROLE cw_schema_owner;\nBEGIN;\n'
                printf 'CREATE POLICY cw_clone_fixture_audit_insert ON public.workspace_audit_events FOR INSERT TO cw_schema_owner WITH CHECK (true);\n'
                cat production-source/experiments/client-workspace-db-security/sql/seed.sql
                printf '\nDROP POLICY cw_clone_fixture_audit_insert ON public.workspace_audit_events;\nCOMMIT;\nRESET ROLE;\n'
              } | docker exec -i -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" \
                sh -eu -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1'
              ;;
            seeded)
              echo "Exact reviewed synthetic fixture already present; skipping duplicate seed."
              ;;
            *)
              echo "Workspace clone fixture state is unexpected; refusing to seed."
              exit 1
              ;;
          esac
      - name: Verify real public-pooler TLS and synthetic tenant isolation
