name: Disposable Neon production-clone acceptance

on:
  workflow_dispatch:
    inputs:
      run_acceptance:
        description: Run the one-time synthetic clone rehearsal
        required: true
        type: boolean
        default: false
  push:
    branches:
      - feat/client-workspace-pooler-tls-acceptance-119
    paths:
      - .github/workflows/workspace-production-clone-acceptance.yml

permissions:
  contents: read

concurrency:
  group: client-workspace-production-clone-acceptance
  cancel-in-progress: false

jobs:
  clone-acceptance:
    if: ${{ github.ref == 'refs/heads/feat/client-workspace-pooler-tls-acceptance-119' && ((github.event_name == 'workflow_dispatch' && inputs.run_acceptance == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[workspace-acceptance-once]')) ) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: neon-pooler-acceptance
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: local_restore
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: local_restore
          PGSSLROOTCERT: /tmp/neon-ca-bundle.pem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U local_restore -d local_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Confirm protected one-time run gate
        env:
          WORKSPACE_POOLER_ACCEPTANCE_RUN: ${{ vars.WORKSPACE_POOLER_ACCEPTANCE_RUN }}
        run: test "$WORKSPACE_POOLER_ACCEPTANCE_RUN" = "1"

      - name: Check out the reviewed production-hardening commit
        uses: actions/checkout@v4
        with:
          ref: 9370f1c79155ea6407f9d2b7cacd2e2f329209b9
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Confirm the checked-out source is pinned
        run: test "$(git rev-parse HEAD)" = "9370f1c79155ea6407f9d2b7cacd2e2f329209b9"

      - name: Install locked dependencies before exposing database credentials
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix experiments/client-workspace-auth

      - name: Initialize disposable PostgreSQL 17 client container
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          printf 'POSTGRES_CONTAINER_ID=%s\n' "$POSTGRES_CONTAINER_ID" >> "$GITHUB_ENV"

      - name: Provide libpq with the runner's trusted CA roots
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { rootCertificates } from "node:tls";
          if (rootCertificates.length === 0) throw new Error("The runner has no trusted TLS roots");
          writeFileSync(
            `${process.env.RUNNER_TEMP}/neon-ca-bundle.pem`,
            rootCertificates.join("\n") + "\n",
            { mode: 0o600 },
          );
          NODE
          docker cp "$RUNNER_TEMP/neon-ca-bundle.pem" "$POSTGRES_CONTAINER_ID:/tmp/neon-ca-bundle.pem"
          docker exec -u 0 "$POSTGRES_CONTAINER_ID" chmod 0644 /tmp/neon-ca-bundle.pem
          docker exec "$POSTGRES_CONTAINER_ID" test -s /tmp/neon-ca-bundle.pem

      - name: Validate the child-only direct URL and define TLS-verified targets
        env:
          WORKSPACE_ACTIVATION_DIRECT_URL: ${{ secrets.WORKSPACE_ACTIVATION_DIRECT_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::$WORKSPACE_ACTIVATION_DIRECT_URL"
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          const raw = process.env.WORKSPACE_ACTIVATION_DIRECT_URL || "";
          const url = new URL(raw);
          const allowedQueries = new Set(["sslmode", "channel_binding"]);
          if (!["postgres:", "postgresql:"].includes(url.protocol) ||
              url.hostname !== "ep-red-meadow-zaur4xpd.c-2.eu-west-2.aws.neon.tech" ||
              url.username !== "cw_activation_migrator" ||
              url.password.length < 32 ||
              url.pathname !== "/digipants_workspace_prod" ||
              url.hash || (url.port && url.port !== "5432") ||
              !["require", "verify-full"].includes(url.searchParams.get("sslmode") || "") ||
              [...url.searchParams.keys()].some(key => !allowedQueries.has(key))) {
            throw new Error("The direct connection is not the reviewed child-only migration login");
          }

          const workspace = new URL(url);
          workspace.searchParams.set("sslmode", "verify-full");
          const auth = new URL(workspace);
          auth.pathname = "/digipants_auth_prod";
          const workspaceShadow = new URL(workspace);
          workspaceShadow.pathname = "/workspace_activation_shadow";
          const authShadow = new URL(workspace);
          authShadow.pathname = "/auth_activation_shadow";
          const restore = new URL(workspace);
          restore.pathname = "/workspace_restore_test";

          const variables = {
            DIRECT_URL: workspace.href,
            DATABASE_URL: workspace.href,
            SHADOW_DIRECT_URL: workspaceShadow.href,
            AUTH_DATABASE_URL: auth.href,
            AUTH_SHADOW_DATABASE_URL: authShadow.href,
            WORKSPACE_ACTIVATION_WORKSPACE_URL: workspace.href,
            WORKSPACE_ACTIVATION_RESTORE_URL: restore.href,
          };
          for (const [key, value] of Object.entries(variables)) {
            process.stdout.write("::add-mask::" + value + "\n");
            appendFileSync(process.env.GITHUB_ENV, key + "=" + value + "\n");
          }
          NODE

      - name: Verify child migrator database and DDL privileges
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          workspace_rights="$(docker exec "$POSTGRES_CONTAINER_ID" psql "$DIRECT_URL" -X -qAt -v ON_ERROR_STOP=1 -c "SELECT current_database() || '|' || has_database_privilege(current_user, current_database(), 'CREATE')::text || '|' || has_schema_privilege(current_user, 'public', 'CREATE')::text || '|' || (SELECT COALESCE(bool_or(admin_option),false) FROM pg_auth_members WHERE roleid='cw_schema_owner'::regrole AND member=current_user::regrole)::text || '|' || (SELECT count(*)=3 AND bool_and(admin_option AND NOT inherit_option AND NOT set_option) FROM pg_auth_members WHERE roleid IN ('cw_schema_owner'::regrole,'cw_audit_writer'::regrole,'cw_runtime'::regrole) AND member=current_user::regrole)::text")"
          auth_rights="$(docker exec "$POSTGRES_CONTAINER_ID" psql "$AUTH_DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 -c "SELECT current_database() || '|' || has_database_privilege(current_user, current_database(), 'CREATE')::text || '|' || has_schema_privilege(current_user, 'public', 'CREATE')::text")"
          test "$workspace_rights" = "digipants_workspace_prod|true|true|true|true"
          test "$auth_rights" = "digipants_auth_prod|true|true"

      - name: Create child-only Prisma shadow databases
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" sh -eu -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1' <<'SQL'
          DROP DATABASE IF EXISTS workspace_activation_shadow WITH (FORCE);
          CREATE DATABASE workspace_activation_shadow;
          DROP DATABASE IF EXISTS auth_activation_shadow WITH (FORCE);
          CREATE DATABASE auth_activation_shadow;
          SQL

      - name: Resolve the verified zero-effect failed migration before retry
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          repair_state="$(docker exec "$POSTGRES_CONTAINER_ID" psql "$DIRECT_URL" -X -qAt -v ON_ERROR_STOP=1 -c "SELECT CASE WHEN EXISTS (SELECT 1 FROM public._prisma_migrations WHERE migration_name = '20261112210000_workspace_signed_authorization_context' AND finished_at IS NULL AND rolled_back_at IS NULL) THEN CASE WHEN EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'pgcrypto') OR to_regclass('public.workspace_context_signing_keys') IS NOT NULL OR to_regprocedure('public.cw_verified_workspace_context()') IS NOT NULL THEN 'unsafe' ELSE 'failed' END ELSE 'clean' END")"
          case "$repair_state" in
            failed) npx prisma migrate resolve --rolled-back 20261112210000_workspace_signed_authorization_context ;;
            clean) ;;
            *) echo "The failed migration has effects that need review; details suppressed." >&2; exit 1 ;;
          esac

      - name: Deploy and verify the Workspace migration ledger twice
        run: |
          set -euo pipefail
          npm run db:generate
          npm run db:migrate:deploy
          npm run db:migrate:deploy
          npm run db:migrate:status
          npx prisma migrate diff --from-migrations prisma/migrations --to-config-datasource --exit-code

      - name: Generate an ephemeral local Better Auth schema secret
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import { randomBytes } from "node:crypto";
          process.stdout.write(`BETTER_AUTH_SECRET=${randomBytes(32).toString("base64url")}\n`);
          NODE

      - name: Deploy and verify the Better Auth migration ledger twice
        working-directory: experiments/client-workspace-auth
        run: |
          set -euo pipefail
          npm run auth:schema
          npm run db:generate
          npm run db:migrate:deploy
          npm run db:migrate:deploy
          npm run db:migrate:status
          npm run db:migrate:diff

      - name: Compare both hosted migration ledgers to committed checksums
        working-directory: experiments/client-workspace-auth
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readdir, readFile } from "node:fs/promises";
          import path from "node:path";
          import pg from "pg";

          async function verify(label, directory, connectionString) {
            const client = new pg.Client({ connectionString });
            try {
              await client.connect();
              const rows = (await client.query(
                'SELECT migration_name, checksum, finished_at, rolled_back_at FROM public."_prisma_migrations" WHERE rolled_back_at IS NULL ORDER BY migration_name'
              )).rows;
              const entries = (await readdir(directory, { withFileTypes: true }))
                .filter(entry => entry.isDirectory())
                .map(entry => entry.name)
                .sort();
              if (rows.length !== entries.length) throw new Error("ledger count");
              for (const name of entries) {
                const row = rows.find(item => item.migration_name === name);
                if (!row || !row.finished_at || row.rolled_back_at ||
                    row.checksum !== createHash("sha256")
                      .update(await readFile(path.join(directory, name, "migration.sql")))
                      .digest("hex")) {
                  throw new Error("ledger checksum");
                }
              }
            } finally {
              await client.end().catch(() => {});
            }
          }

          try {
            await verify("workspace", "../../prisma/migrations", process.env.DIRECT_URL);
            await verify("auth", "prisma/migrations", process.env.AUTH_DATABASE_URL);
            process.stdout.write("PASS: both hosted migration ledgers and checksums match the pinned source\n");
          } catch {
            process.stderr.write("Migration ledger or checksum acceptance failed; connection details suppressed.\n");
            process.exitCode = 1;
          }
          NODE

      - name: Apply Workspace hardening and seed the synthetic fixture under RLS
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          {
            printf 'BEGIN;\n'
            cat experiments/client-workspace-db-security/sql/roles.sql
            cat experiments/client-workspace-db-security/sql/hardening.sql
            printf '\nCOMMIT;\n'
          } | docker exec -i -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" sh -eu -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1'
          docker exec -i -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" sh -eu -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1' < scripts/workspace/production-rls-hardening.sql
          docker exec -i -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" sh -eu -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "GRANT cw_schema_owner TO cw_activation_migrator WITH INHERIT TRUE, SET TRUE"'
          docker exec -i -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" sh -eu -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1' <<'SQL'
          SET ROLE cw_schema_owner;
          BEGIN;
          DELETE FROM public.workspace_audit_events
           WHERE idempotency_key IN ('fixture-tenant-a','fixture-tenant-b');
          DELETE FROM public.workspace_progress_updates
           WHERE id IN ('a2222222-2222-4222-8222-222222222222');
          DELETE FROM public.workspace_milestones
           WHERE id IN ('a1111111-1111-4111-8111-111111111111',
                        'a1111111-1111-4111-8111-222222222222');
          DELETE FROM public.workspace_enrollment_attempts
           WHERE id='aaaaaaa0-bbbb-4ccc-8ddd-eeeeeeeeeeee';
          DELETE FROM public.workspace_invitation_records
           WHERE id='77777777-7777-4777-8777-777777777777';
          DELETE FROM public.workspace_client_project_grants
           WHERE principal_id='cccccccc-cccc-4ccc-8ccc-cccccccccccc';
          DELETE FROM public.workspace_staff_project_grants
           WHERE principal_id IN ('33333333-3333-4333-8333-333333333333',
                                  '55555555-5555-4555-8555-555555555555',
                                  '44444444-4444-4444-8444-444444444444');
          DELETE FROM public.workspace_client_memberships
           WHERE principal_id='cccccccc-cccc-4ccc-8ccc-cccccccccccc';
          DELETE FROM public.workspace_staff_memberships
           WHERE principal_id IN ('33333333-3333-4333-8333-333333333333',
                                  '55555555-5555-4555-8555-555555555555',
                                  '44444444-4444-4444-8444-444444444444');
          DELETE FROM public.workspace_principals
           WHERE id IN ('33333333-3333-4333-8333-333333333333',
                        '55555555-5555-4555-8555-555555555555',
                        'cccccccc-cccc-4ccc-8ccc-cccccccccccc',
                        '44444444-4444-4444-8444-444444444444');
          DELETE FROM public.workspace_projects
           WHERE id IN ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
                        'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb');
          DELETE FROM public.workspace_tenants
           WHERE id IN ('11111111-1111-4111-8111-111111111111',
                        '22222222-2222-4222-8222-222222222222');
          DELETE FROM public.workspace_context_signing_keys
           WHERE singleton AND signing_key=decode(repeat('11',32),'hex');
          UPDATE public.workspace_founder_bootstrap_control
             SET founder_email_hash=NULL
           WHERE singleton AND founder_email_hash=decode(repeat('a1',32),'hex');
          COMMIT;
          RESET ROLE;
          SQL
          {
            printf 'SET ROLE cw_schema_owner;\n'
            cat experiments/client-workspace-db-security/sql/seed.sql
            printf '\nRESET ROLE;\n'
          } | docker exec -i -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" sh -eu -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1'

      - name: Apply and validate restricted Better Auth runtime grants
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i -e DATABASE_URL="$AUTH_DATABASE_URL" "$POSTGRES_CONTAINER_ID" sh -eu -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1' < experiments/client-workspace-auth/sql/runtime-privileges.sql
          docker exec -i -e DATABASE_URL="$AUTH_DATABASE_URL" "$POSTGRES_CONTAINER_ID" sh -eu -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1' < experiments/client-workspace-auth/sql/verify-runtime-privileges.sql

      - name: Require every read-only production security preflight flag
        working-directory: experiments/client-workspace-auth
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" sh -eu -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "GRANT cw_schema_owner TO cw_activation_migrator WITH INHERIT TRUE, SET TRUE"'
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import pg from "pg";

          async function verifyPreflight(label, filename, connectionString) {
            const client = new pg.Client({ connectionString });
            try {
              await client.connect();
              await client.query("SET ROLE cw_schema_owner");
              const sql = await readFile(filename, "utf8");
              const rows = (await client.query(sql)).rows;
              if (rows.length !== 1 || Object.values(rows[0]).some(value => value !== true)) {
                throw new Error(label);
              }
            } finally {
              await client.end().catch(() => {});
            }
          }

          try {
            await verifyPreflight("workspace", "../../scripts/workspace/production-security-preflight.sql", process.env.DIRECT_URL);
            await verifyPreflight("auth", "../../scripts/workspace/production-auth-preflight.sql", process.env.AUTH_DATABASE_URL);
            process.stdout.write("PASS: every Workspace and authentication security-preflight flag is true\n");
          } catch {
            process.stderr.write("A production database security-preflight flag failed; details suppressed.\n");
            process.exitCode = 1;
          }
          NODE

      - name: Prove real public pooler TLS and tenant isolation
        working-directory: experiments/client-workspace-auth
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          WORKSPACE_POOLER_ACCEPTANCE_ENABLED: "1"
          WORKSPACE_POOLER_TEST_DATABASE: digipants_workspace_prod
          WORKSPACE_POOLER_TEST_BRANCH_ID: br-green-firefly-za9a48ms
          WORKSPACE_POOLER_LIVE_BRANCH_ID: br-floral-shadow-zapa2jbz
          WORKSPACE_POOLER_TEST_TENANT_A: 11111111-1111-4111-8111-111111111111
          WORKSPACE_POOLER_TEST_TENANT_B: 22222222-2222-4222-8222-222222222222
        run: |
          set -euo pipefail
          pooler_password="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          echo "::add-mask::$pooler_password"
          export PGOPTIONS="-c app.pooler_test_password=$pooler_password"
          docker exec -i -e DATABASE_URL="$DIRECT_URL" -e PGOPTIONS="$PGOPTIONS" "$POSTGRES_CONTAINER_ID" sh -eu -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1' <<'SQL'
          DO $do$
          DECLARE password_value text := current_setting('app.pooler_test_password');
          BEGIN
            IF EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = 'cw_pooler_acceptance') THEN
              EXECUTE format(
                'ALTER ROLE cw_pooler_acceptance WITH LOGIN INHERIT NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD %L',
                password_value
              );
            ELSE
              EXECUTE format(
                'CREATE ROLE cw_pooler_acceptance LOGIN INHERIT NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD %L',
                password_value
              );
            END IF;
          END
          $do$;
          GRANT cw_runtime TO cw_pooler_acceptance WITH INHERIT TRUE, SET FALSE;
          GRANT CONNECT ON DATABASE digipants_workspace_prod TO cw_pooler_acceptance;
          SQL
          export WORKSPACE_POOLER_PASSWORD="$pooler_password"
          export WORKSPACE_POOLER_TEST_URL="$(node --input-type=module <<'NODE'
          const url = new URL(process.env.DIRECT_URL);
          url.hostname = "ep-red-meadow-zaur4xpd-pooler.c-2.eu-west-2.aws.neon.tech";
          url.username = "cw_pooler_acceptance";
          url.password = process.env.WORKSPACE_POOLER_PASSWORD;
          url.searchParams.set("sslmode", "verify-full");
          process.stdout.write(url.href);
          NODE
          )"
          export WORKSPACE_RLS_CONTEXT_KEY="$(node -e 'process.stdout.write(Buffer.alloc(32, 0x11).toString("base64url"))')"
          echo "::add-mask::$WORKSPACE_POOLER_TEST_URL"
          echo "::add-mask::$WORKSPACE_RLS_CONTEXT_KEY"
          node scripts/neon-pooler-acceptance.mjs

      - name: Create an idempotent synthetic state transition for restore proof
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" sh -eu -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1' <<'SQL'
          SET ROLE cw_schema_owner;
          BEGIN;
          UPDATE public.workspace_projects
             SET state = 'active', revision = 2
           WHERE id = 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
             AND (state <> 'active' OR revision <> 2);
          INSERT INTO public.workspace_audit_events
            (tenant_id, project_id, actor_principal_id, origin, action, object_type,
             object_id, before_revision, after_revision, idempotency_key)
          VALUES
            ('11111111-1111-4111-8111-111111111111',
             'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
             '44444444-4444-4444-8444-444444444444',
             'system', 'state.transition', 'workspace_project',
             'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', 1, 2, 'state-transition-001')
          ON CONFLICT (tenant_id, idempotency_key) DO NOTHING;
          COMMIT;
          RESET ROLE;
          SQL

      - name: Back up the Neon clone, restore it on Neon, and verify recovered state
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/workspace-neon-child.dump"
          trap 'rm -f "$backup"' EXIT
          docker exec -i -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" sh -eu -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS workspace_restore_test WITH (FORCE)" -c "CREATE DATABASE workspace_restore_test"'
          counts="$(docker exec -i -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" sh -eu -c 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1 ' <<'SQL'
          SET ROLE cw_schema_owner;
          SELECT (SELECT count(*) FROM public.workspace_tenants)::text,
                 (SELECT count(*) FROM public.workspace_projects)::text,
                 (SELECT count(*) FROM public.workspace_audit_events)::text;
          RESET ROLE;
          SQL
          )"
          IFS='|' read -r expected_tenant_count expected_project_count expected_audit_count <<< "$counts"
          test -n "$expected_tenant_count"
          test -n "$expected_project_count"
          test -n "$expected_audit_count"
          docker exec -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" sh -eu -c 'pg_dump --format=custom --no-owner --no-acl --role=cw_schema_owner --dbname="$DATABASE_URL"' > "$backup"
          test -s "$backup"
          docker exec -i -e DATABASE_URL="$WORKSPACE_ACTIVATION_RESTORE_URL" "$POSTGRES_CONTAINER_ID" sh -eu -c 'pg_restore --exit-on-error --no-owner --no-acl --role=cw_schema_owner --dbname="$DATABASE_URL"' < "$backup"
          {
            printf 'SET ROLE cw_schema_owner;\n'
            cat experiments/client-workspace-db-security/sql/verify-restore.sql
          } | docker exec -i \
            -e DATABASE_URL="$WORKSPACE_ACTIVATION_RESTORE_URL" \
            -e EXPECTED_TENANT_COUNT="$expected_tenant_count" \
            -e EXPECTED_PROJECT_COUNT="$expected_project_count" \
            -e EXPECTED_AUDIT_COUNT="$expected_audit_count" \
            "$POSTGRES_CONTAINER_ID" sh -eu -c 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -v expected_tenant_count="$EXPECTED_TENANT_COUNT" -v expected_project_count="$EXPECTED_PROJECT_COUNT" -v expected_audit_count="$EXPECTED_AUDIT_COUNT"'

      - name: Report isolated acceptance completion
        if: success()
        run: |
          echo "PASS: current-head migrations, Neon pooled TLS, tenant isolation, both preflights, and Neon clone backup/restore"
