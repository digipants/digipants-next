      - name: Append a signed synthetic transition for backup/restore verification
        working-directory: production-source/experiments/client-workspace-auth
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import pg from "pg";
          import { createSignedContextToken } from "./scripts/neon-pooler-acceptance.mjs";

          const client = new pg.Client({ connectionString: process.env.DIRECT_URL });
          try {
            await client.connect();
            await client.query("BEGIN");
            const { rows } = await client.query(
              "SELECT pg_current_xact_id()::text AS xid");
            const context = {
              transactionId: rows[0].xid,
              tenantId: "11111111-1111-4111-8111-111111111111",
              projectId: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa",
              actorSubject: "synthetic-security-owner",
              purpose: "delivery.edit",
            };
            const token = createSignedContextToken(context);
            await client.query("SET ROLE cw_schema_owner");
            await client.query(
              "SELECT set_config('app.workspace_tenant_id',$1,true), " +
              "set_config('app.workspace_context_token',$2,true)",
              [context.tenantId, token]);
            const update = await client.query(
              "UPDATE public.workspace_projects SET state='active',revision=2 " +
              "WHERE id=$1::uuid AND tenant_id=$2::uuid AND revision=1",
              [context.projectId, context.tenantId]);
            if (update.rowCount !== 1) throw new Error("transition");
            await client.query(
              "SELECT public.cw_append_audit_event($1::uuid,$2::uuid,$3::uuid," +
              "'system','state.transition','workspace_project',$2::text,1,2,$4)",
              [context.tenantId, context.projectId,
               "44444444-4444-4444-8444-444444444444", "state-transition-001"]);
            await client.query("COMMIT");
            process.stdout.write("PASS: signed synthetic state transition and audit were recorded\n");
          } catch {
            await client.query("ROLLBACK").catch(() => {});
            process.stderr.write("Signed synthetic transition failed; connection details suppressed.\n");
            process.exitCode = 1;
          } finally { await client.end().catch(() => {}); }
          NODE

      - name: Back up the Neon child and restore into isolated local PostgreSQL
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/workspace-child-recovery.dump"
          cleanup() {
            docker exec -i -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" \
              sh -eu -c 'psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1' \
              >/dev/null 2>&1 <<'SQL' || true
          SET ROLE cw_schema_owner;
          DROP POLICY IF EXISTS cw_clone_backup_audit_read ON public.workspace_audit_events;
          RESET ROLE;
          SQL
            rm -f "$backup"
          }
          trap cleanup EXIT
          docker exec "$POSTGRES_CONTAINER_ID" psql -U local_restore -d postgres \
            -v ON_ERROR_STOP=1 -c "CREATE DATABASE workspace_restore_test"
          counts="$(docker exec -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" \
            sh -eu -c 'psql "$DATABASE_URL" -X -qAt -F "|" -v ON_ERROR_STOP=1' <<'SQL'
          SET ROLE cw_schema_owner;
          SELECT (SELECT count(*) FROM public.workspace_tenants)::text,
                 (SELECT count(*) FROM public.workspace_projects)::text;
          RESET ROLE;
          SQL
          )"
          IFS='|' read -r expected_tenants expected_projects <<< "$counts"
          test "$expected_tenants" = "2"
          test "$expected_projects" = "2"
          expected_audits=3

          docker exec -i -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" \
            sh -eu -c 'psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1' <<'SQL'
          SET ROLE cw_schema_owner;
          CREATE POLICY cw_clone_backup_audit_read ON public.workspace_audit_events
            FOR SELECT TO cw_schema_owner USING (true);
          RESET ROLE;
          SQL
          docker exec -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" \
            sh -eu -c 'pg_dump --format=custom --no-owner --no-acl --role=cw_schema_owner --dbname="$DATABASE_URL"' \
            > "$backup"
          test -s "$backup"

          docker exec -i -e DATABASE_URL="$DIRECT_URL" "$POSTGRES_CONTAINER_ID" \
            sh -eu -c 'psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1' <<'SQL'
          SET ROLE cw_schema_owner;
          DROP POLICY cw_clone_backup_audit_read ON public.workspace_audit_events;
          RESET ROLE;
          SQL
          docker exec -i "$POSTGRES_CONTAINER_ID" pg_restore \
            -U local_restore -d workspace_restore_test --exit-on-error \
            --no-owner --no-acl < "$backup"
          docker exec "$POSTGRES_CONTAINER_ID" psql -U local_restore \
            -d workspace_restore_test -v ON_ERROR_STOP=1 \
            -c "DROP POLICY cw_clone_backup_audit_read ON public.workspace_audit_events"
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U local_restore \
            -d workspace_restore_test -v ON_ERROR_STOP=1 \
            -v expected_tenant_count="$expected_tenants" \
            -v expected_project_count="$expected_projects" \
            -v expected_audit_count="$expected_audits" \
            < production-source/experiments/client-workspace-db-security/sql/verify-restore.sql
          rm -f "$backup"
          trap - EXIT
      - name: Report completed disposable acceptance
        if: success()
        run: |
          echo "PASS: clone-only TLS, signed RLS isolation, auth session gates, revocation, migration checksums, security preflights, and recovery restore"
