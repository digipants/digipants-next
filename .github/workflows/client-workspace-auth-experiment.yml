name: Client Workspace auth security experiment

on:
  pull_request:
    branches: [main, feat/client-workspace-trusted-tenant-96]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/client-workspace-auth-experiment.yml"
      - "experiments/client-workspace-auth/**"
      - "app/api/auth/**"
      - "app/workspace/**"
      - "next.config.mjs"
      - "lib/client-workspace/invite-fragment.ts"
      - "lib/analytics.ts"
      - "components/analytics/AnalyticsConsent.tsx"
      - "package.json"
      - "package-lock.json"
      - "prisma.config.ts"
      - "prisma/**"
      - "lib/client-workspace/access-policy.ts"
      - "lib/client-workspace/effective-grants.ts"
      - "tests/**"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  local-auth-security-validation:
    if: ${{ github.event.pull_request.head.ref == 'feat/client-workspace-auth-74' || github.event.pull_request.head.ref == 'feat/client-workspace-mfa-freshness-76' || github.event.pull_request.head.ref == 'feat/client-workspace-invite-issuance-81' || github.event.pull_request.head.ref == 'feat/client-workspace-mail-ownership-84' || github.event.pull_request.head.ref == 'feat/client-workspace-staff-auth-86' || github.event.pull_request.head.ref == 'feat/client-workspace-proven-signup-88' || github.event.pull_request.head.ref == 'feat/client-workspace-trusted-tenant-96' || github.event.pull_request.head.ref == 'feat/client-workspace-enrollment-recovery-97' || github.event.pull_request.head.ref == 'feat/client-workspace-authenticated-read-111' || (github.event.pull_request.head.ref == 'feat/client-workspace-authenticated-http-113' || (github.event.pull_request.head.ref == 'feat/client-workspace-pilot-activation-114' || (github.event.pull_request.head.ref == 'feat/client-workspace-invite-onboarding-115' || (github.event.pull_request.head.ref == 'feat/client-workspace-delivery-reliability-116' || github.event.pull_request.head.ref == 'feat/client-workspace-mail-abuse-gates-117')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: digipants_ws_dev
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: digipants_workspace_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digipants_ws_dev -d digipants_workspace_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install the locked repository dependencies with engine integrity checks enabled
        run: npm ci
      - name: Install the locked isolated experiment dependencies with engine integrity checks enabled
        working-directory: experiments/client-workspace-auth
        run: npm ci

      - name: Create isolated loopback databases and synthetic runtime secret
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          DIRECT_URL: postgresql://digipants_ws_dev:disposable_ci_only@127.0.0.1:5432/digipants_workspace_dev
          SHADOW_DIRECT_URL: postgresql://digipants_ws_dev:disposable_ci_only@127.0.0.1:5432/workspace_shadow
          AUTH_DATABASE_URL: postgresql://digipants_ws_dev:disposable_ci_only@127.0.0.1:5432/auth_spike_test
          AUTH_SHADOW_DATABASE_URL: postgresql://digipants_ws_dev:disposable_ci_only@127.0.0.1:5432/auth_spike_shadow
        run: |
          set -euo pipefail
          auth_secret="$(openssl rand -hex 32)"
          mail_outbox_key="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          mail_rate_hmac_key="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          echo "::add-mask::$auth_secret"
          echo "::add-mask::$mail_outbox_key"
          echo "::add-mask::$mail_rate_hmac_key"
          {
            echo "DIRECT_URL=$DIRECT_URL"
            echo "DATABASE_URL=$DIRECT_URL"
            echo "SHADOW_DIRECT_URL=$SHADOW_DIRECT_URL"
            echo "WORKSPACE_DATABASE_URL=$DIRECT_URL"
            echo "AUTH_DATABASE_URL=$AUTH_DATABASE_URL"
            echo "AUTH_SHADOW_DATABASE_URL=$AUTH_SHADOW_DATABASE_URL"
            echo "WORKSPACE_DB_TEST_LOCAL=1"
            echo "AUTH_EXPERIMENT_ENABLED=1"
            echo "AUTH_BASE_URL=http://localhost:3000/api/auth"
            echo "BETTER_AUTH_SECRET=$auth_secret"
            echo "WORKSPACE_MAIL_OUTBOX_KEY=$mail_outbox_key"
            echo "WORKSPACE_MAIL_RATE_HMAC_KEY=$mail_rate_hmac_key"
          } >> "$GITHUB_ENV"
          for database in workspace_shadow auth_spike_test auth_spike_shadow; do
            docker exec "$POSTGRES_CONTAINER_ID" psql \
              -v ON_ERROR_STOP=1 \
              -U digipants_ws_dev \
              -d postgres \
              -c "CREATE DATABASE $database;"
          done

      - name: Generate the root Prisma client
        run: npm run db:generate
      - name: Apply the root workspace migration
        run: npm run db:migrate:deploy
      - name: Confirm root migration rerun is idempotent
        run: npm run db:migrate:deploy
      - name: Check root migration status
        run: npm run db:migrate:status
      - name: Verify root migration ledger and schema drift
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          expected_count="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          total_count="$(docker exec "$POSTGRES_CONTAINER_ID" psql -v ON_ERROR_STOP=1 -U digipants_ws_dev -d digipants_workspace_dev -Atqc \
            'SELECT count(*) FROM public."_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL')"
          test "$total_count" = "$expected_count"
          for migration in prisma/migrations/*/; do
            expected_name="${migration%/}"
            expected_name="${expected_name##*/}"
            success_count="$(docker exec "$POSTGRES_CONTAINER_ID" psql -v ON_ERROR_STOP=1 -U digipants_ws_dev -d digipants_workspace_dev -Atqc \
              "SELECT count(*) FROM public.\"_prisma_migrations\" WHERE migration_name = '$expected_name' AND finished_at IS NOT NULL AND rolled_back_at IS NULL")"
            test "$success_count" = 1
          done
          npx prisma migrate diff --from-migrations prisma/migrations --to-config-datasource --exit-code

      - name: Generate and apply the isolated Better Auth schema
        working-directory: experiments/client-workspace-auth
        run: |
          npm run auth:schema
          npm run db:generate
          npm run db:migrate:deploy
          npm run db:migrate:deploy
          npm run db:migrate:status
      - name: Verify Better Auth migration ownership and drift
        working-directory: experiments/client-workspace-auth
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          expected_count="$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          total_count="$(docker exec "$POSTGRES_CONTAINER_ID" psql -v ON_ERROR_STOP=1 -U digipants_ws_dev -d auth_spike_test -Atqc \
            'SELECT count(*) FROM public."_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL')"
          auth_table_count="$(docker exec "$POSTGRES_CONTAINER_ID" psql -v ON_ERROR_STOP=1 -U digipants_ws_dev -d auth_spike_test -Atqc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'auth_spike' AND table_name IN ('user','session','account','verification','twoFactor','totp_code_use')")"
          workspace_table_count="$(docker exec "$POSTGRES_CONTAINER_ID" psql -v ON_ERROR_STOP=1 -U digipants_ws_dev -d auth_spike_test -Atqc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'auth_spike' AND table_name LIKE 'workspace_%'")"
          test "$total_count" = "$expected_count"
          for migration in prisma/migrations/*/; do
            expected_name="${migration%/}"
            expected_name="${expected_name##*/}"
            success_count="$(docker exec "$POSTGRES_CONTAINER_ID" psql -v ON_ERROR_STOP=1 -U digipants_ws_dev -d auth_spike_test -Atqc \
              "SELECT count(*) FROM public.\"_prisma_migrations\" WHERE migration_name = '$expected_name' AND finished_at IS NOT NULL AND rolled_back_at IS NULL")"
            test "$success_count" = 1
          done
          test "$auth_table_count" = 6
          expected_workspace_table_count=0
          if [ -d experiments/client-workspace-auth/prisma/migrations/20261030120000_workspace_mailbox_proof_spends ]; then
            expected_workspace_table_count=1
          fi
          test "$workspace_table_count" = "$expected_workspace_table_count"
          npm run db:migrate:diff

      - name: Run existing authentication integration suite
        if: ${{ github.event.pull_request.head.ref != 'feat/client-workspace-enrollment-recovery-97' && github.event.pull_request.head.ref != 'feat/client-workspace-authenticated-read-111' && github.event.pull_request.head.ref != 'feat/client-workspace-authenticated-http-113' && github.event.pull_request.head.ref != 'feat/client-workspace-pilot-activation-114' && github.event.pull_request.head.ref != 'feat/client-workspace-invite-onboarding-115' && github.event.pull_request.head.ref != 'feat/client-workspace-delivery-reliability-116' && github.event.pull_request.head.ref != 'feat/client-workspace-mail-abuse-gates-117' }}
        working-directory: experiments/client-workspace-auth
        env:
          RUN_AUTH_EXPERIMENT_INTEGRATION: 1
          NODE_OPTIONS: --conditions=react-server
        run: npm run test:integration
      - name: Run invitation and grant fixtures BEFORE append-only audit hardening
        if: ${{ github.event.pull_request.head.ref == 'feat/client-workspace-authenticated-read-111' || (github.event.pull_request.head.ref == 'feat/client-workspace-authenticated-http-113' || (github.event.pull_request.head.ref == 'feat/client-workspace-pilot-activation-114' || (github.event.pull_request.head.ref == 'feat/client-workspace-invite-onboarding-115' || (github.event.pull_request.head.ref == 'feat/client-workspace-delivery-reliability-116' || github.event.pull_request.head.ref == 'feat/client-workspace-mail-abuse-gates-117')))) }}
        working-directory: experiments/client-workspace-auth
        env:
          RUN_AUTH_EXPERIMENT_INTEGRATION: 1
          NODE_OPTIONS: --conditions=react-server
        run: node --import tsx --test tests/invitation-postgres.test.mjs tests/invite-issuance-postgres.test.mjs tests/mailbox-proof-postgres.test.mjs tests/staff-authorization-postgres.test.mjs
      - name: Verify staff invitation dispatch and recipient proof BEFORE hardening
        if: ${{ github.event.pull_request.head.ref == 'feat/client-workspace-invite-onboarding-115' }}
        working-directory: experiments/client-workspace-auth
        env:
          RUN_AUTH_EXPERIMENT_INTEGRATION: 1
          NODE_OPTIONS: --conditions=react-server
        run: >-
          node --import tsx --test
          tests/trusted-invitation-delivery-postgres.test.mjs
          tests/mailbox-proof-delivery-postgres.test.mjs
      - name: Verify encrypted atomic mailbox outbox, failure retry and ownership
        if: ${{ (github.event.pull_request.head.ref == 'feat/client-workspace-delivery-reliability-116' || github.event.pull_request.head.ref == 'feat/client-workspace-mail-abuse-gates-117') }}
        working-directory: experiments/client-workspace-auth
        env:
          RUN_AUTH_EXPERIMENT_INTEGRATION: 1
          WORKSPACE_MAIL_OUTBOX_TEST_ENABLED: 1
          WORKSPACE_MAIL_RATE_LIMIT_TEST_ENABLED: ${{ github.event.pull_request.head.ref == 'feat/client-workspace-mail-abuse-gates-117' && '1' || '0' }}
          NODE_OPTIONS: --conditions=react-server
        run: >-
          node --import tsx --test
          tests/trusted-invitation-delivery-postgres.test.mjs
          tests/mailbox-proof-delivery-postgres.test.mjs
      - name: Verify atomic HMAC quotas and no-live-send Resend transport
        if: ${{ github.event.pull_request.head.ref == 'feat/client-workspace-mail-abuse-gates-117' }}
        working-directory: experiments/client-workspace-auth
        env:
          RUN_AUTH_EXPERIMENT_INTEGRATION: 1
          RUN_RESEND_TRANSPORT_TEST: 1
          WORKSPACE_MAIL_RATE_LIMIT_TEST_ENABLED: 1
          NODE_OPTIONS: --conditions=react-server
        run: >-
          node --import tsx --test
          tests/mailbox-request-quota-postgres.test.mjs
          tests/resend-mailbox-transport.test.mjs
      - name: Run baseline authentication fixtures for enrollment PR
        if: ${{ github.event.pull_request.head.ref == 'feat/client-workspace-enrollment-recovery-97' || github.event.pull_request.head.ref == 'feat/client-workspace-mail-abuse-gates-117' }}
        working-directory: experiments/client-workspace-auth
        env:
          RUN_AUTH_EXPERIMENT_INTEGRATION: 1
        run: node --import tsx --test tests/invitation-postgres.test.mjs tests/invite-issuance-postgres.test.mjs tests/mailbox-proof-postgres.test.mjs tests/staff-authorization-postgres.test.mjs
      - name: Run the full isolated non-database contract suite
        working-directory: experiments/client-workspace-auth
        run: npm test
      - name: Run the complete repository test suite
        run: node --test tests/*.test.mjs
      - name: Run existing workspace PostgreSQL persistence tests
        run: node tests/client-workspace-persistence.integration.mjs
      - name: Apply and verify isolated runtime and audit role contract
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U digipants_ws_dev -d digipants_workspace_dev -v ON_ERROR_STOP=1 < experiments/client-workspace-db-security/sql/seed.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U digipants_ws_dev -d digipants_workspace_dev -v ON_ERROR_STOP=1 < experiments/client-workspace-db-security/sql/roles.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U digipants_ws_dev -d digipants_workspace_dev -v ON_ERROR_STOP=1 < experiments/client-workspace-db-security/sql/hardening.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U digipants_ws_dev -d digipants_workspace_dev -v ON_ERROR_STOP=1 < experiments/client-workspace-db-security/sql/verify.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U digipants_ws_dev -d auth_spike_test -v ON_ERROR_STOP=1 < experiments/client-workspace-auth/sql/runtime-privileges.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" psql -U digipants_ws_dev -d auth_spike_test -v ON_ERROR_STOP=1 < experiments/client-workspace-auth/sql/verify-runtime-privileges.sql
      - name: Run durable enrollment recovery integration tests
        if: ${{ github.event.pull_request.head.ref == 'feat/client-workspace-enrollment-recovery-97' || github.event.pull_request.head.ref == 'feat/client-workspace-mail-abuse-gates-117' }}
        working-directory: experiments/client-workspace-auth
        env:
          RUN_AUTH_EXPERIMENT_INTEGRATION: 1
          NODE_OPTIONS: --conditions=react-server
          AUTH_EXPERIMENT_DEBUG: 1
        run: node --import tsx --test tests/enrollment-saga-postgres.test.mjs
      - name: Exercise invitation-only Better Auth handler against PostgreSQL
        if: ${{ github.event.pull_request.head.ref == 'feat/client-workspace-enrollment-recovery-97' }}
        working-directory: experiments/client-workspace-auth
        env:
          RUN_AUTH_EXPERIMENT_INTEGRATION: 1
          NODE_OPTIONS: --conditions=react-server
        run: node --import tsx --test tests/auth.integration.test.mjs
      - name: Exercise verified-subject state changes and concurrent revocation
        working-directory: experiments/client-workspace-auth
        env:
          RUN_AUTH_EXPERIMENT_INTEGRATION: 1
          NODE_OPTIONS: --conditions=react-server
          AUTH_EXPERIMENT_DEBUG: 1
        run: npm run test:trusted-state
      - name: Test invitation-only Better Auth enrollment AFTER audit hardening
        if: ${{ github.event.pull_request.head.ref == 'feat/client-workspace-authenticated-read-111' || github.event.pull_request.head.ref == 'feat/client-workspace-mail-abuse-gates-117' }}
        working-directory: experiments/client-workspace-auth
        env:
          RUN_AUTH_EXPERIMENT_INTEGRATION: 1
          NODE_OPTIONS: --conditions=react-server
        run: node --import tsx --test tests/auth.integration.test.mjs
      - name: Provision distinct NON-superuser runtime login for published read test
        if: ${{ github.event.pull_request.head.ref == 'feat/client-workspace-authenticated-read-111' || (github.event.pull_request.head.ref == 'feat/client-workspace-authenticated-http-113' || (github.event.pull_request.head.ref == 'feat/client-workspace-pilot-activation-114' || (github.event.pull_request.head.ref == 'feat/client-workspace-invite-onboarding-115' || (github.event.pull_request.head.ref == 'feat/client-workspace-delivery-reliability-116' || github.event.pull_request.head.ref == 'feat/client-workspace-mail-abuse-gates-117')))) }}
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER_ID" psql -U digipants_ws_dev -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE cw_client_read_ci LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB PASSWORD 'synthetic_read_ci_pw'"
          docker exec "$POSTGRES_CONTAINER_ID" psql -U digipants_ws_dev -d postgres -v ON_ERROR_STOP=1 -c "GRANT cw_runtime TO cw_client_read_ci WITH INHERIT TRUE, SET FALSE"
          docker exec "$POSTGRES_CONTAINER_ID" psql -U digipants_ws_dev -d postgres -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE digipants_workspace_dev TO cw_client_read_ci"
      - name: Verify session-bound published client project read, revocation and tenant isolation
        if: ${{ github.event.pull_request.head.ref == 'feat/client-workspace-authenticated-read-111' || (github.event.pull_request.head.ref == 'feat/client-workspace-authenticated-http-113' || (github.event.pull_request.head.ref == 'feat/client-workspace-pilot-activation-114' || (github.event.pull_request.head.ref == 'feat/client-workspace-invite-onboarding-115' || (github.event.pull_request.head.ref == 'feat/client-workspace-delivery-reliability-116' || github.event.pull_request.head.ref == 'feat/client-workspace-mail-abuse-gates-117')))) }}
        working-directory: experiments/client-workspace-auth
        env:
          RUN_AUTH_EXPERIMENT_INTEGRATION: 1
          NODE_OPTIONS: --conditions=react-server
          WORKSPACE_READ_RUNTIME_DATABASE_URL: postgresql://cw_client_read_ci:synthetic_read_ci_pw@127.0.0.1:5432/digipants_workspace_dev
        run: node --import tsx --test tests/trusted-published-project-postgres.test.mjs
      - name: Verify authentic MFA cookie through restricted client HTTP read and deny routes
        if: ${{ (github.event.pull_request.head.ref == 'feat/client-workspace-authenticated-http-113' || (github.event.pull_request.head.ref == 'feat/client-workspace-pilot-activation-114' || (github.event.pull_request.head.ref == 'feat/client-workspace-invite-onboarding-115' || (github.event.pull_request.head.ref == 'feat/client-workspace-delivery-reliability-116' || github.event.pull_request.head.ref == 'feat/client-workspace-mail-abuse-gates-117')))) }}
        working-directory: experiments/client-workspace-auth
        env:
          RUN_AUTH_EXPERIMENT_INTEGRATION: 1
          RUN_CLIENT_HTTP_INTEGRATION: 1
          NODE_OPTIONS: --conditions=react-server
          WORKSPACE_READ_RUNTIME_DATABASE_URL: postgresql://cw_client_read_ci:synthetic_read_ci_pw@127.0.0.1:5432/digipants_workspace_dev
        run: node --import tsx --test tests/auth.integration.test.mjs
      - name: Verify mounted Next.js authentication plus actual project read end to end
        if: ${{ (github.event.pull_request.head.ref == 'feat/client-workspace-pilot-activation-114' || (github.event.pull_request.head.ref == 'feat/client-workspace-invite-onboarding-115' || (github.event.pull_request.head.ref == 'feat/client-workspace-delivery-reliability-116' || github.event.pull_request.head.ref == 'feat/client-workspace-mail-abuse-gates-117'))) }}
        working-directory: experiments/client-workspace-auth
        env:
          RUN_AUTH_EXPERIMENT_INTEGRATION: 1
          RUN_CLIENT_HTTP_INTEGRATION: 1
          RUN_NEXT_AUTH_INTEGRATION: 1
          NODE_OPTIONS: --conditions=react-server
          WORKSPACE_READ_RUNTIME_DATABASE_URL: postgresql://cw_client_read_ci:synthetic_read_ci_pw@127.0.0.1:5432/digipants_workspace_dev
        run: node --import tsx --test tests/auth.integration.test.mjs
      - name: Chrome browser smoke for private invitation, login and denied project
        if: ${{ (github.event.pull_request.head.ref == 'feat/client-workspace-delivery-reliability-116' || github.event.pull_request.head.ref == 'feat/client-workspace-mail-abuse-gates-117') }}
        env:
          AUTH_EXPERIMENT_ENABLED: "1"
          WORKSPACE_NEXT_ROUTE_TEST_ENABLED: "1"
          WORKSPACE_CLIENT_HTTP_TEST_ENABLED: "1"
          WORKSPACE_MAIL_PROOF_TEST_ENABLED: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/workspace-browser-next.log 2>&1 &
          app_pid="$!"
          trap 'kill "$app_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 75); do
            if curl --silent --show-error --fail --max-time 5 http://localhost:3000/workspace/invite/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            tail -n 70 /tmp/workspace-browser-next.log
            exit 1
          fi

          # A synthetic link fragment is never submitted to the Next server.
          fake_bearer="$(printf 'A%.0s' {1..43})"
          "$chrome" --headless --no-sandbox --disable-gpu             --disable-dev-shm-usage --disable-background-networking             --virtual-time-budget=10000             --dump-dom "http://localhost:3000/workspace/invite/#invite=$fake_bearer"             > /tmp/workspace-invite-dom.html 2> /tmp/workspace-chrome-stderr.log
          if ! grep -q 'Confirm the invited mailbox' /tmp/workspace-invite-dom.html; then
            echo "Invitation UI did not hydrate into its private recipient step"
            node - <<'NODE'
          const fs=require("node:fs");
          const html=fs.readFileSync("/tmp/workspace-invite-dom.html","utf8");
          const words=["Checking your invitation link","Invitation unavailable",
            "Confirm the invited mailbox","404","Internal Server Error","Error"];
          console.log("Synthetic invite HTML diagnostics:",JSON.stringify({
            bytes:html.length,
            matches:Object.fromEntries(words.map(x=>[x,html.includes(x)])),
            appScripts:(html.match(/<script\\b/g)||[]).length,
          }));
          NODE
            grep -E '(Error|error|warn|compiled|Ready|GET /workspace)' /tmp/workspace-browser-next.log | tail -n 24 || true
            tail -n 12 /tmp/workspace-chrome-stderr.log
            exit 1
          fi
          "$chrome" --headless --no-sandbox --disable-gpu             --disable-dev-shm-usage --disable-background-networking             --virtual-time-budget=10000             --dump-dom "http://localhost:3000/workspace/login/"             > /tmp/workspace-login-dom.html 2>> /tmp/workspace-chrome-stderr.log
          grep -q 'Sign in to your project' /tmp/workspace-login-dom.html
          "$chrome" --headless --no-sandbox --disable-gpu             --disable-dev-shm-usage --disable-background-networking             --virtual-time-budget=10000             --dump-dom "http://localhost:3000/workspace/tenants/11111111-1111-4111-8111-111111111111/projects/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/"             > /tmp/workspace-denied-dom.html 2>> /tmp/workspace-chrome-stderr.log
          grep -q 'This project is unavailable' /tmp/workspace-denied-dom.html
          echo "Browser smoke passed: invitation fragment, login form and guest project denial"
          "$chrome" --headless --no-sandbox --disable-gpu             --disable-dev-shm-usage --disable-background-networking             --window-size=1280,960 --virtual-time-budget=8000             --screenshot=/tmp/workspace-invite-ci.png             "http://localhost:3000/workspace/invite/#invite=$fake_bearer"             >/dev/null 2>> /tmp/workspace-chrome-stderr.log
          "$chrome" --headless --no-sandbox --disable-gpu             --disable-dev-shm-usage --disable-background-networking             --window-size=1280,960 --virtual-time-budget=8000             --screenshot=/tmp/workspace-login-ci.png             "http://localhost:3000/workspace/login/"             >/dev/null 2>> /tmp/workspace-chrome-stderr.log
      - name: Upload synthetic browser screenshots
        if: ${{ (github.event.pull_request.head.ref == 'feat/client-workspace-delivery-reliability-116' || github.event.pull_request.head.ref == 'feat/client-workspace-mail-abuse-gates-117') }}
        uses: actions/upload-artifact@v4
        with:
          name: workspace-browser-synthetic
          path: |
            /tmp/workspace-invite-ci.png
            /tmp/workspace-login-ci.png
          retention-days: 7
          if-no-files-found: error
      - name: Type-check the isolated auth experiment
        working-directory: experiments/client-workspace-auth
        run: npm run typecheck
      - name: Type-check the repository
        run: npx tsc --noEmit
      - name: Build the normal production application
        run: npm run build
      - name: Check patch whitespace
        run: git diff --check
