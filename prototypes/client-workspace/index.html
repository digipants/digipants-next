<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Proposal review · DigiPants local prototype</title><link rel="stylesheet" href="/style.css"></head><body>
<a class="skip" href="#main">Skip to proposal</a><div class="notice">LOCAL PROTOTYPE · Synthetic data · UI simulation with no secure live decisions</div>
<header><a href="#main" class="brand">DigiPants <span>/ Client Workspace</span></a><span>Alex Example</span></header>
<section class="controls" aria-label="Prototype controls"><label>Scenario <select id="scenario"><option>current</option><option>expired</option><option>superseded</option><option>loading</option><option>empty</option><option>invalid</option><option>access-denied</option></select></label><label><input id="fail" type="checkbox"> Fail next decision</label><label><input id="stale" type="checkbox"> Version changes during decision</label><label><input id="dark" type="checkbox"> Dark appearance</label><button id="reset">Reset simulation</button></section>
<main id="main" tabindex="-1"></main><div id="feedback" role="status" aria-live="polite" aria-atomic="true"></div><div id="errors" role="alert" aria-atomic="true"></div>
<dialog id="confirmation" aria-labelledby="confirm-title" aria-describedby="confirm-description"><form id="decision-form" novalidate><p class="eyebrow">SIMULATED DECISION</p><h2 id="confirm-title"></h2><p id="confirm-description">Temporary example decision only. Nothing is sent or saved. Acceptance only leads to Awaiting kickoff checks.</p><label id="reason-label" for="reason">What would you like changed?</label><textarea id="reason" maxlength="1000" aria-describedby="reason-error"></textarea><p id="reason-error" class="error" role="alert"></p><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary" id="confirm" type="submit">Confirm simulation</button></div></form></dialog>
<script type="module" src="/app.mjs"></script></body></html>
